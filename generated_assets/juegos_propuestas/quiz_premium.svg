<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="quiz2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <filter id="quiz2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#quiz2BgGrad)" />

  <!-- 3 Option Choice Buttons (A, B - Correct, C) -->
  <!-- Option A -->
  <g transform="translate(18, 22)" filter="url(#quiz2Shadow)">
    <rect x="0" y="0" width="84" height="22" rx="7" fill="#1E1B4B" stroke="#A855F7" stroke-width="1.5" />
    <circle cx="14" cy="11" r="6" fill="#A855F7" />
    <text x="14" y="14.5" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
    <rect x="26" y="8" width="44" height="6" rx="3" fill="#64748B" />
  </g>

  <!-- Option B: CORRECT SELECTED BUTTON (Green Glow!) -->
  <g transform="translate(18, 50)" filter="url(#quiz2Shadow)">
    <rect x="0" y="0" width="84" height="22" rx="7" fill="#10B981" stroke="#34D399" stroke-width="2.5" />
    <circle cx="14" cy="11" r="6" fill="#FFFFFF" />
    <text x="14" y="14.5" font-family="sans-serif" font-size="9" font-weight="900" fill="#10B981" text-anchor="middle">B</text>
    <rect x="26" y="8" width="38" height="6" rx="3" fill="#FFFFFF" />

    <!-- Green Checkmark Badge -->
    <circle cx="76" cy="11" r="8" fill="#FFFFFF" />
    <path d="M 72,11 L 75,14 L 80,8" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Option C -->
  <g transform="translate(18, 78)" filter="url(#quiz2Shadow)">
    <rect x="0" y="0" width="84" height="22" rx="7" fill="#1E1B4B" stroke="#A855F7" stroke-width="1.5" />
    <circle cx="14" cy="11" r="6" fill="#A855F7" />
    <text x="14" y="14.5" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">C</text>
    <rect x="26" y="8" width="32" height="6" rx="3" fill="#64748B" />
  </g>
</svg>
