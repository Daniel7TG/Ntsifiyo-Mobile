<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rompecabezas2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="rompecabezas2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#rompecabezas2BgGrad)" />

  <!-- Base Board Puzzle Grid -->
  <g transform="translate(24, 28)" filter="url(#rompecabezas2Shadow)">
    <rect x="0" y="0" width="72" height="72" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2" />
    
    <!-- Fitted Pieces -->
    <path d="M 0,0 L 36,0 L 36,36 L 0,36 Z" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 36,0 L 72,0 L 72,36 L 36,36 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 0,36 L 36,36 L 36,72 L 0,72 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Empty Slot Shadow (Bottom Right) -->
    <rect x="36" y="36" width="36" height="36" rx="4" fill="#94A3B8" opacity="0.35" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- Hovering Orange Puzzle Piece Fitting into Slot -->
  <g transform="translate(62, 54)" filter="url(#rompecabezas2Shadow)">
    <path d="M 0,0 L 32,0 L 32,32 L 0,32 Z" fill="#FF6B00" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Connector Tab on top -->
    <circle cx="16" cy="0" r="5" fill="#FF6B00" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>
