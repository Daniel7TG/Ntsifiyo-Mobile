<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="memoria2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="memoria2GaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="memoria2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#memoria2BgGrad)" />

  <!-- Speed Gauge Bar (Arcade Combo Meter) -->
  <g transform="translate(20, 22)" filter="url(#memoria2Shadow)">
    <rect x="0" y="0" width="80" height="12" rx="6" fill="#334155" />
    <rect x="2" y="2" width="60" height="8" rx="4" fill="url(#memoria2GaugeGrad)" />
    <!-- Indicator needle pin -->
    <rect x="60" y="-2" width="4" height="16" rx="2" fill="#FFFFFF" />
  </g>

  <!-- Fast Flashcard popping up -->
  <g transform="translate(34, 44)" filter="url(#memoria2Shadow)">
    <rect x="0" y="0" width="52" height="58" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2.5" />
    
    <!-- Fast Check Action Button -->
    <circle cx="26" cy="24" r="14" fill="#10B981" />
    <path d="M 18,24 L 24,30 L 34,18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Word Tag below -->
    <rect x="10" y="44" width="32" height="6" rx="3" fill="#0284C7" />
  </g>

  <!-- Fire Flame Spark on top right -->
  <g transform="translate(86, 42)" filter="url(#memoria2Shadow)">
    <path d="M 0,16 C -6,16 -10,12 -10,6 C -10,0 -4,-8 0,-14 C 4,-8 10,0 10,6 C 10,12 6,16 0,16 Z" fill="#EF4444" />
    <path d="M 0,16 C -3,16 -5,13 -5,9 C -5,5 -2,0 0,-4 C 2,0 5,5 5,9 C 5,13 3,16 0,16 Z" fill="#F59E0B" />
  </g>
</svg>
