<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="memorama2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="memorama2CardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="memorama2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#memorama2BgGrad)" />

  <!-- 2x2 Memory Layout -->
  <!-- Top Left: Face Down Card -->
  <g transform="translate(18, 18)" filter="url(#memorama2Shadow)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="url(#memorama2CardBack)" stroke="#34D399" stroke-width="1.8" />
    <circle cx="19" cy="19" r="8" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Bottom Right: Face Down Card -->
  <g transform="translate(64, 64)" filter="url(#memorama2Shadow)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="url(#memorama2CardBack)" stroke="#34D399" stroke-width="1.8" />
    <circle cx="19" cy="19" r="8" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Top Right: Flipped MATCH Card (Sun 1) -->
  <g transform="translate(64, 18)" filter="url(#memorama2Shadow)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.2" />
    <circle cx="19" cy="19" r="10" fill="#FDE047" />
    <!-- Sun Ray Accents -->
    <path d="M 19,6 L 19,10 M 19,28 L 19,32 M 6,19 L 10,19 M 28,19 L 32,19" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Left: Flipped MATCH Card (Sun 2 - PERFECT PAIR!) -->
  <g transform="translate(18, 64)" filter="url(#memorama2Shadow)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.2" />
    <circle cx="19" cy="19" r="10" fill="#FDE047" />
    <path d="M 19,6 L 19,10 M 19,28 L 19,32 M 6,19 L 10,19 M 28,19 L 32,19" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Connecting Golden Sparkle Arc between matched pair -->
  <path d="M 64,37 C 40,40 40,60 37,64" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="3 3" />
</svg>
