<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="intruso2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="intruso2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#intruso2BgGrad)" />

  <!-- 2x2 Grid Tiles -->
  <!-- Top Left: Green Apple -->
  <g transform="translate(20, 20)" filter="url(#intruso2Shadow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Apple -->
    <path d="M 18,12 C 10,12 8,20 10,26 C 12,32 24,32 26,26 C 28,20 26,12 18,12 Z" fill="#10B981" />
    <path d="M 18,12 C 18,8 21,7 23,7" stroke="#78350F" stroke-width="1.5" fill="none" />
  </g>

  <!-- Top Right: Green Apple -->
  <g transform="translate(64, 20)" filter="url(#intruso2Shadow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 18,12 C 10,12 8,20 10,26 C 12,32 24,32 26,26 C 28,20 26,12 18,12 Z" fill="#10B981" />
    <path d="M 18,12 C 18,8 21,7 23,7" stroke="#78350F" stroke-width="1.5" fill="none" />
  </g>

  <!-- Bottom Left: Green Apple -->
  <g transform="translate(20, 64)" filter="url(#intruso2Shadow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 18,12 C 10,12 8,20 10,26 C 12,32 24,32 26,26 C 28,20 26,12 18,12 Z" fill="#10B981" />
    <path d="M 18,12 C 18,8 21,7 23,7" stroke="#78350F" stroke-width="1.5" fill="none" />
  </g>

  <!-- Bottom Right: THE INTRUDER (Violet Eggplant / Different Object + Red X) -->
  <g transform="translate(64, 64)" filter="url(#intruso2Shadow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#FFF1F2" stroke="#EF4444" stroke-width="2.5" />
    <!-- Eggplant / Intrusive Shape -->
    <path d="M 18,10 C 14,10 12,18 14,24 C 16,30 24,30 25,24 C 26,18 22,10 18,10 Z" fill="#8B5CF6" />
    <path d="M 18,10 L 18,6" stroke="#047857" stroke-width="2" fill="none" />

    <!-- Red X Badge -->
    <circle cx="30" cy="6" r="7" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 27,3 L 33,9 M 33,3 L 27,9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
