<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="buscar2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="buscar2BeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>
    <filter id="buscar2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#buscar2BgGrad)" />

  <!-- Radar / Scanner Circles -->
  <g stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.35">
    <circle cx="60" cy="60" r="42" />
    <circle cx="60" cy="60" r="28" />
    <circle cx="60" cy="60" r="14" />
    <line x1="18" y1="60" x2="102" y2="60" />
    <line x1="60" y1="18" x2="60" y2="102" />
  </g>

  <!-- Radar Sweep Beam Sector -->
  <path d="M 60,60 L 60,18 A 42,42 0 0,1 102,60 Z" fill="url(#buscar2BeamGrad)" />

  <!-- Target Crosshair Lock on 'J' -->
  <g transform="translate(75, 42)">
    <circle cx="0" cy="0" r="14" fill="#0284C7" opacity="0.8" stroke="#22D3EE" stroke-width="2" />
    <!-- Letter J -->
    <path d="M 3,-6 L 3,3 C 3,6 0,7 -3,5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Main Gold Search Lens -->
  <g transform="translate(44, 52)" filter="url(#buscar2Shadow)">
    <!-- Lens Rim -->
    <circle cx="0" cy="0" r="22" fill="#0F172A" stroke="#F59E0B" stroke-width="5" />
    <circle cx="0" cy="0" r="19" fill="#0284C7" opacity="0.5" />
    <!-- Handle -->
    <path d="M 16,16 L 34,34" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" />
    <path d="M 16,16 L 34,34" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <!-- Revealed Letter 'Ñ' in Lens -->
    <text x="0" y="7" font-family="sans-serif" font-size="20" font-weight="900" fill="#FDE047" text-anchor="middle">Ñ</text>
  </g>
</svg>
