<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="sopa2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="sopa2BowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="sopa2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#sopa2BgGrad)" />

  <!-- Soup Bowl Outer Frame -->
  <g transform="translate(60, 60)" filter="url(#sopa2Shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#sopa2BowlGrad)" stroke="#B45309" stroke-width="3" />
    <!-- Soup Broth Inside -->
    <circle cx="0" cy="0" r="34" fill="#F59E0B" />

    <!-- Floating Letter Pasta Noodles in Soup -->
    <g fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">
      <text x="-16" y="-14">A</text>
      <text x="12" y="-16">Z</text>
      <text x="-20" y="12">M</text>
      <text x="16" y="16">O</text>
      <text x="0" y="-4">Ñ</text>
    </g>

    <!-- Floating Veggies (Green Peas, Carrot Cubes) -->
    <circle cx="-8" cy="-22" r="3" fill="#10B981" />
    <circle cx="22" cy="-4" r="3" fill="#10B981" />
    <rect x="-14" y="18" width="5" height="5" rx="1" fill="#EF4444" />
    <rect x="18" y="-22" width="5" height="5" rx="1" fill="#EF4444" />
  </g>

  <!-- Cyan Magnifying Glass Viewfinder Over Soup -->
  <g transform="translate(42, 42)" filter="url(#sopa2Shadow)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#06B6D4" stroke-width="4" />
    <circle cx="0" cy="0" r="16" fill="#22D3EE" opacity="0.3" />
    <line x1="13" y1="13" x2="28" y2="28" stroke="#06B6D4" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
