<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="laberinto2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="laberinto2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#laberinto2BgGrad)" />

  <!-- Concentric Circular Maze Disk -->
  <g transform="translate(60, 60)" filter="url(#laberinto2Shadow)">
    <!-- Outer Ring Wall -->
    <circle cx="0" cy="0" r="42" fill="#1E1B4B" stroke="#6D28D9" stroke-width="4" />
    
    <!-- Ring 2 Wall with openings -->
    <path d="M 0,-30 A 30,30 0 0,1 30,0 M 30,0 A 30,30 0 0,1 0,30 M -30,0 A 30,30 0 0,1 0,-30" fill="none" stroke="#8B5CF6" stroke-width="3.5" />

    <!-- Ring 1 Inner Wall -->
    <path d="M -18,0 A 18,18 0 0,1 18,0 M 0,18 A 18,18 0 0,1 -18,0" fill="none" stroke="#C084FC" stroke-width="3" />

    <!-- Center Goal Core (Glowing Golden Portal) -->
    <circle cx="0" cy="0" r="8" fill="#FDE047" stroke="#F59E0B" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />

    <!-- Glowing Cyan Route Line navigating into center -->
    <path d="M 0,-42 A 42,42 0 0,1 42,0 L 30,0 A 30,30 0 0,0 0,-30 L 0,-18 A 18,18 0 0,1 18,0 L 8,0" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" />

    <!-- Start Key Icon at entrance -->
    <g transform="translate(0, -42) rotate(45)">
      <circle cx="0" cy="0" r="5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
  </g>
</svg>
