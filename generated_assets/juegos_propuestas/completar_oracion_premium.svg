<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="completar2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="completar2PenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="completar2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#completar2BgGrad)" />

  <!-- Lined Notebook Page Base -->
  <g transform="translate(18, 20)" filter="url(#completar2Shadow)">
    <rect x="0" y="0" width="84" height="80" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
    
    <!-- Red Left Margin Line -->
    <line x1="16" y1="0" x2="16" y2="80" stroke="#EF4444" stroke-width="1.2" opacity="0.6" />

    <!-- Notebook Horizontal Lines -->
    <line x1="0" y1="20" x2="84" y2="20" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="0" y1="38" x2="84" y2="38" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="0" y1="56" x2="84" y2="56" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Written Text simulated -->
    <path d="M 22,16 L 46,16 M 22,34 L 38,34 M 22,52 L 40,52" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />

    <!-- Blank Slot highlighted in Gold -->
    <rect x="42" y="28" width="34" height="10" rx="4" fill="#FDE047" stroke="#F59E0B" stroke-width="1.8" />
    <path d="M 46,33 L 70,33" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 2" />
  </g>

  <!-- Golden Fountain Pen writing into slot -->
  <g transform="translate(74, 28) rotate(-45)" filter="url(#completar2Shadow)">
    <!-- Pen Body -->
    <rect x="-4" y="-30" width="8" height="34" rx="2" fill="url(#completar2PenGrad)" />
    <rect x="-5" y="-6" width="10" height="4" fill="#FDE047" />
    <!-- Nib Tip -->
    <path d="M -4,0 L 4,0 L 0,10 Z" fill="#78350F" />
    <circle cx="0" cy="3" r="1" fill="#FEF3C7" />
  </g>
</svg>
