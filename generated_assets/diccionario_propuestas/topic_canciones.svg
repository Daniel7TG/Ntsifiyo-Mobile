<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cancionesPurpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <linearGradient id="cancionesGuitarWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#cancionesPurpleBg)" />

  <!-- Acoustic Guitar Diagonal -->
  <g transform="translate(30, 32) rotate(-35)">
    <!-- Guitar Body -->
    <path d="M -12,4 C -18,4 -20,16 -12,22 C -6,26 6,26 12,22 C 20,16 18,4 12,4 C 8,4 6,8 0,8 C -6,8 -8,4 -12,4 Z" fill="url(#cancionesGuitarWood)" stroke="#451A03" stroke-width="1.2" />
    <!-- Sound Hole -->
    <circle cx="0" cy="14" r="4" fill="#451A03" stroke="#FDE68A" stroke-width="1" />
    
    <!-- Neck & Headstock -->
    <rect x="-2.5" y="-22" width="5" height="26" fill="#78350F" />
    <path d="M -4,-26 L 4,-26 L 3,-22 L -3,-22 Z" fill="#451A03" />
    
    <!-- Strings -->
    <line x1="-1" y1="-24" x2="-1" y2="20" stroke="#FFFBEB" stroke-width="0.8" opacity="0.9" />
    <line x1="1" y1="-24" x2="1" y2="20" stroke="#FFFBEB" stroke-width="0.8" opacity="0.9" />
  </g>

  <!-- Sound Waves & Musical Notes -->
  <g transform="translate(42, 18)">
    <path d="M -4,0 C 0,-6 6,-6 10,0" fill="none" stroke="#9333EA" stroke-width="1.8" stroke-linecap="round" />
    <ellipse cx="6" cy="-2" rx="3" ry="2" fill="#9333EA" transform="rotate(-20 6 -2)" />
  </g>
  <circle cx="18" cy="42" r="2" fill="#C084FC" />
  <circle cx="22" cy="46" r="1.5" fill="#C084FC" />
</svg>
