<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="anecdotasNightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="anecdotasFireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#anecdotasNightBg)" />

  <!-- Stars in background -->
  <circle cx="16" cy="18" r="1" fill="#FFFFFF" opacity="0.8" />
  <circle cx="48" cy="14" r="1.2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="52" cy="30" r="0.8" fill="#FFFFFF" opacity="0.7" />
  <circle cx="12" cy="34" r="0.8" fill="#FFFFFF" opacity="0.6" />

  <!-- Campfire Logs -->
  <g transform="translate(32, 44)">
    <path d="M -14,-1 L 14,5 L 12,9 L -16,3 Z" fill="#78350F" />
    <path d="M 14,-1 L -14,5 L -12,9 L 16,3 Z" fill="#451A03" />
    <circle cx="0" cy="4" r="3" fill="#B45309" />
  </g>

  <!-- Campfire Flames -->
  <g transform="translate(32, 34)">
    <!-- Outer Flame -->
    <path d="M 0,-18 C 8,-12 12,-4 12,4 C 12,10 7,14 0,14 C -7,14 -12,10 -12,4 C -12,-4 -8,-12 0,-18 Z" fill="url(#anecdotasFireGrad)" />
    <!-- Inner Flame -->
    <path d="M 0,-8 C 4,-4 6,0 6,4 C 6,7 3,9 0,9 C -3,9 -6,7 -6,4 C -6,0 -4,-4 0,-8 Z" fill="#FEF08A" />
  </g>

  <!-- Floating embers / story sparks -->
  <circle cx="26" cy="18" r="1.5" fill="#FDE047" opacity="0.9" />
  <circle cx="38" cy="14" r="1.2" fill="#F97316" opacity="0.9" />
  <circle cx="33" cy="10" r="1.8" fill="#FDE047" opacity="0.95" />
</svg>
