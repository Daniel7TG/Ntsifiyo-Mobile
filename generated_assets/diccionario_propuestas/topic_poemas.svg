<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="poemasRoyalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
    <linearGradient id="poemasInkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#poemasRoyalBg)" />

  <!-- Ink Bottle / Inkwell Base -->
  <g transform="translate(24, 34)">
    <!-- Bottle Body -->
    <path d="M -12,0 C -14,0 -16,4 -16,10 C -16,16 -12,18 0,18 C 12,18 16,16 16,10 C 16,4 14,0 12,0 Z" fill="url(#poemasInkGrad)" />
    <!-- Bottle Neck & Rim -->
    <rect x="-8" y="-6" width="16" height="6" rx="2" fill="#E11D48" />
    <ellipse cx="0" cy="-6" rx="9" ry="3" fill="#BE123C" />
    <ellipse cx="0" cy="-6" rx="6" ry="2" fill="#450A0A" />

    <!-- Glass Reflection Highlight -->
    <path d="M -10,4 C -12,8 -12,12 -10,14" fill="none" stroke="#FDA4AF" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Dipping Golden Quill Nib -->
  <g transform="translate(36, 24) rotate(-25)">
    <!-- Nib Body -->
    <path d="M -5,-18 L 5,-18 L 4,6 L 0,12 L -4,6 Z" fill="#F59E0B" stroke="#B45309" stroke-width="0.8" />
    <!-- Nib Slit & Breather Hole -->
    <circle cx="0" cy="-2" r="1.5" fill="#B45309" />
    <line x1="0" y1="-2" x2="0" y2="12" stroke="#B45309" stroke-width="1" />
  </g>

  <!-- Floating Poetry Sparkles / Heart Verses -->
  <path d="M 44,14 C 44,12 42,10 40,10 C 38,10 36,12 36,14 C 36,17 40,20 40,20 C 40,20 44,17 44,14 Z" fill="#E11D48" />
  <circle cx="16" cy="22" r="1.5" fill="#F59E0B" />
  <circle cx="48" cy="28" r="1.2" fill="#F59E0B" />
</svg>
