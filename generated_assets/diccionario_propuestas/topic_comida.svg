<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="comidaCornBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="comidaKernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="comidaHuskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#comidaCornBg)" />

  <!-- Sacred Corn / Elote -->
  <g transform="translate(32, 30)">
    <!-- Golden Corn Cob Body -->
    <path d="M -8,-18 C -8,-22 0,-24 0,-24 C 0,-24 8,-22 8,-18 C 10,-8 10,6 0,12 C -10,6 -10,-8 -8,-18 Z" fill="url(#comidaKernelGrad)" />

    <!-- Kernel Grid Lines -->
    <!-- Rows -->
    <line x1="-7" y1="-16" x2="7" y2="-16" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />
    <line x1="-8" y1="-10" x2="8" y2="-10" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />
    <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />
    <line x1="-7" y1="2" x2="7" y2="2" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />
    <line x1="-5" y1="7" x2="5" y2="7" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />
    <!-- Columns -->
    <line x1="-3" y1="-20" x2="-3" y2="10" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />
    <line x1="3" y1="-20" x2="3" y2="10" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />

    <!-- Left Husk Leaf -->
    <path d="M -12,-6 C -18,6 -14,20 0,22 C -8,18 -10,8 -6,-2 Z" fill="url(#comidaHuskGrad)" />
    <!-- Right Husk Leaf -->
    <path d="M 12,-6 C 18,6 14,20 0,22 C 8,18 10,8 6,-2 Z" fill="url(#comidaHuskGrad)" />
    <!-- Stem Base -->
    <rect x="-3" y="20" width="6" height="6" rx="1.5" fill="#047857" />
  </g>
</svg>
