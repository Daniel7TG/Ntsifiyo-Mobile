<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="ropaIndigoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <linearGradient id="ropaBlouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="ropaCollarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#ropaIndigoBg)" />

  <!-- Wooden Hanger -->
  <g transform="translate(32, 14)">
    <!-- Hook -->
    <path d="M 0,4 C 0,0 3,-2 3,-4 C 3,-6 1,-7 0,-7 C -2,-7 -3,-5 -3,-5" fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
    <!-- Wooden Shoulders -->
    <path d="M -14,10 L 0,4 L 14,10" fill="none" stroke="#B45309" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Mazahua Blouse / Quexquemetl -->
  <g transform="translate(32, 35)">
    <!-- Main Blouse Garment -->
    <path d="M -15,-13 L -6,-16 L 0,-10 L 6,-16 L 15,-13 L 18,10 L -18,10 Z" fill="url(#ropaBlouseGrad)" stroke="#1E1B4B" stroke-width="1" />
    
    <!-- V-Neck Embroidered Collar (Fuchsia) -->
    <path d="M -6,-16 L 0,-6 L 6,-16" fill="none" stroke="url(#ropaCollarGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Embroidered Faja Belt (Gold) -->
    <rect x="-18" y="4" width="36" height="6" fill="#F59E0B" />
    <path d="M -16,4 L -16,10 M -12,4 L -12,10 M -8,4 L -8,10 M -4,4 L -4,10 M 0,4 L 0,10 M 4,4 L 4,10 M 8,4 L 8,10 M 12,4 L 12,10 M 16,4 L 16,10" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9" />

    <!-- Flower Embroidery Motif on Chest -->
    <circle cx="0" cy="-1" r="2.2" fill="#FBBF24" />
    <circle cx="-3.5" cy="-1" r="1.3" fill="#FFFFFF" />
    <circle cx="3.5" cy="-1" r="1.3" fill="#FFFFFF" />
    <circle cx="0" cy="-4.5" r="1.3" fill="#FFFFFF" />
  </g>
</svg>
