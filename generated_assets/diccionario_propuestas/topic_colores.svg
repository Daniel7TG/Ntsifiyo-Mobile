<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="coloresDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#coloresDarkBg)" />

  <!-- Spectrum Color Wheel Slices -->
  <g transform="translate(32, 32)">
    <!-- Slice Red -->
    <path d="M 0,0 L 0,-22 A 22,22 0 0,1 15.5,-15.5 Z" fill="#EF4444" />
    <!-- Slice Orange -->
    <path d="M 0,0 L 15.5,-15.5 A 22,22 0 0,1 22,0 Z" fill="#F97316" />
    <!-- Slice Yellow -->
    <path d="M 0,0 L 22,0 A 22,22 0 0,1 15.5,15.5 Z" fill="#EAB308" />
    <!-- Slice Green -->
    <path d="M 0,0 L 15.5,15.5 A 22,22 0 0,1 0,22 Z" fill="#10B981" />
    <!-- Slice Cyan -->
    <path d="M 0,0 L 0,22 A 22,22 0 0,1 -15.5,15.5 Z" fill="#06B6D4" />
    <!-- Slice Blue -->
    <path d="M 0,0 L -15.5,15.5 A 22,22 0 0,1 -22,0 Z" fill="#3B82F6" />
    <!-- Slice Purple -->
    <path d="M 0,0 L -22,0 A 22,22 0 0,1 -15.5,-15.5 Z" fill="#A855F7" />
    <!-- Slice Pink -->
    <path d="M 0,0 L -15.5,-15.5 A 22,22 0 0,1 0,-22 Z" fill="#EC4899" />

    <!-- Center White Core -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="4" fill="#0F172A" />
  </g>
</svg>
