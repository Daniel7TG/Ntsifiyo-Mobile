<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cuerpoRoseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
    <linearGradient id="cuerpoFigureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#cuerpoRoseBg)" />

  <!-- Glowing pulse circle -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Human Figure Silhouette -->
  <g transform="translate(32, 32)">
    <!-- Head -->
    <circle cx="0" cy="-15" r="5" fill="url(#cuerpoFigureGrad)" />
    <!-- Body Torso & Arms extended -->
    <path d="M -16,-7 C -10,-9 10,-9 16,-7 C 18,-6 18,-3 15,-3 C 12,-3 9,-5 6,-5 L 6,6 L 10,20 C 11,22 8,23 7,20 L 3,8 L -3,8 L -7,20 C -8,23 -11,22 -10,20 L -6,6 L -6,-5 C -9,-5 -12,-3 -15,-3 C -18,-3 -18,-6 -16,-7 Z" fill="url(#cuerpoFigureGrad)" />
  </g>

  <!-- Heartbeat ECG pulse line overlay -->
  <path d="M 12,32 L 22,32 L 25,24 L 29,40 L 34,22 L 38,36 L 41,32 L 52,32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
