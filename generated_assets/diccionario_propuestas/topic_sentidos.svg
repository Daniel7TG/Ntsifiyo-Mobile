<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="sentidosTealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>
    <linearGradient id="sentidosHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#sentidosTealBg)" />

  <!-- Center Head Silhouette -->
  <g transform="translate(32, 32)">
    <!-- Orbital Ring for the 5 Senses -->
    <circle cx="0" cy="0" r="19" fill="none" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.75" />

    <!-- Head Side Profile Silhouette -->
    <path d="M -8,14 C -8,14 -7,8 -5,6 C -3,4 -5,-2 -5,-6 C -5,-12 0,-15 5,-15 C 10,-15 13,-11 13,-6 C 13,-3 11,-1 11,1 C 11,2 14,2 14,4 C 14,5 11,6 11,7 C 11,9 13,10 11,11 C 9,12 5,12 2,12 C 0,12 -3,14 -8,14 Z" fill="url(#sentidosHeadGrad)" />

    <!-- 5 Colored Sense Orbs on Orbit Ring -->
    <!-- 1. Sight / Eye (Red Orb, Top) -->
    <g transform="translate(0, -19)">
      <circle cx="0" cy="0" r="4.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- 2. Sound / Ear (Blue Orb, Top Right) -->
    <g transform="translate(18, -6)">
      <circle cx="0" cy="0" r="4.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1" />
      <path d="M -1,-1.5 C 1,-1.5 1,1.5 -1,1.5" fill="none" stroke="#FFFFFF" stroke-width="1" />
    </g>

    <!-- 3. Smell / Nose (Green Orb, Bottom Right) -->
    <g transform="translate(11, 15)">
      <circle cx="0" cy="0" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
    </g>

    <!-- 4. Taste / Lips (Orange Orb, Bottom Left) -->
    <g transform="translate(-11, 15)">
      <circle cx="0" cy="0" r="4.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1" />
    </g>

    <!-- 5. Touch / Hand (Purple Orb, Top Left) -->
    <g transform="translate(-18, -6)">
      <circle cx="0" cy="0" r="4.5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1" />
    </g>
  </g>
</svg>
