<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="pronombresBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="pronombresPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="pronombresSecondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#pronombresBgGrad)" />

  <!-- Connecting dashed lines -->
  <line x1="32" y1="20" x2="18" y2="42" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="2.5 2.5" />
  <line x1="32" y1="20" x2="46" y2="42" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="2.5 2.5" />

  <!-- Central User Avatar ("YO" - Golden Amber Circle) -->
  <g transform="translate(32, 20)">
    <circle cx="0" cy="0" r="10" fill="url(#pronombresSecondaryGrad)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="0" cy="-3" r="3.5" fill="#FFFFFF" />
    <path d="M -5.5,5.5 C -5.5,2.5 -3,1.5 0,1.5 C 3,1.5 5.5,2.5 5.5,5.5 Z" fill="#FFFFFF" />
  </g>

  <!-- Second Avatar ("TÚ" - Sky Blue Circle Left) -->
  <g transform="translate(18, 42)">
    <circle cx="0" cy="0" r="8.5" fill="url(#pronombresPrimaryGrad)" stroke="#FFFFFF" stroke-width="1.8" />
    <circle cx="0" cy="-2.5" r="3" fill="#FFFFFF" />
    <path d="M -4.5,4.5 C -4.5,2 -2.5,1 0,1 C 2.5,1 4.5,2 4.5,4.5 Z" fill="#FFFFFF" />
  </g>

  <!-- Group Avatar ("NOSOTROS" - Emerald/Teal Circle Right) -->
  <g transform="translate(46, 42)">
    <circle cx="0" cy="0" r="8.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.8" />
    <circle cx="-2.5" cy="-2" r="2.2" fill="#FFFFFF" />
    <circle cx="2.5" cy="-2" r="2.2" fill="#FFFFFF" opacity="0.8" />
    <path d="M -5.5,4.5 C -5.5,2 -3.5,1 -2.5,1 C -1.5,1 0,2 0,4.5 Z" fill="#FFFFFF" />
    <path d="M 0,4.5 C 0,2 1.5,1 2.5,1 C 3.5,1 5.5,2 5.5,4.5 Z" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
