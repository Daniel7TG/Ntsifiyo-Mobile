<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="animalesForestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <linearGradient id="animalesMonarchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#animalesForestBg)" />

  <!-- Monarch Butterfly -->
  <g transform="translate(32, 32)">
    <!-- Top Left Wing -->
    <path d="M 0,-3 C -10,-24 -26,-18 -22,2 C -18,10 -6,4 0,-3 Z" fill="url(#animalesMonarchGrad)" stroke="#1E293B" stroke-width="1.8" />
    <!-- Top Right Wing -->
    <path d="M 0,-3 C 10,-24 26,-18 22,2 C 18,10 6,4 0,-3 Z" fill="url(#animalesMonarchGrad)" stroke="#1E293B" stroke-width="1.8" />

    <!-- Bottom Left Wing -->
    <path d="M 0,2 C -16,6 -18,20 -6,18 C -2,16 0,6 0,2 Z" fill="url(#animalesMonarchGrad)" stroke="#1E293B" stroke-width="1.8" />
    <!-- Bottom Right Wing -->
    <path d="M 0,2 C 16,6 18,20 6,18 C 2,16 0,6 0,2 Z" fill="url(#animalesMonarchGrad)" stroke="#1E293B" stroke-width="1.8" />

    <!-- Wing Spots / Accents -->
    <circle cx="-16" cy="-10" r="1.5" fill="#FFFFFF" />
    <circle cx="16" cy="-10" r="1.5" fill="#FFFFFF" />
    <circle cx="-11" cy="14" r="1.2" fill="#FFFFFF" />
    <circle cx="11" cy="14" r="1.2" fill="#FFFFFF" />

    <!-- Body & Antennae -->
    <path d="M -0.5,-16 C -3,-20 -5,-22 -7,-22 M 0.5,-16 C 3,-20 5,-22 7,-22" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" />
    <ellipse cx="0" cy="-2" rx="2.5" ry="12" fill="#1E293B" />
    <circle cx="0" cy="-15" r="2.8" fill="#1E293B" />
  </g>
</svg>
