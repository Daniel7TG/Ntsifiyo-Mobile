<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="leyendasCosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="leyendasSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#leyendasCosmicBg)" />

  <!-- Dual Sun & Moon Indigenous Myth Emblem -->
  <g transform="translate(32, 32)">
    <!-- Sun Rays -->
    <path d="M 0,-24 L 3,-18 L -3,-18 Z M 0,24 L 3,18 L -3,18 Z M -24,0 L -18,3 L -18,-3 Z M 24,0 L 18,3 L 18,-3 Z" fill="#FBBF24" />
    <path d="M -16,-16 L -11,-12 L -14,-9 Z M 16,16 L 11,12 L 14,9 Z M -16,16 L -11,12 L -14,9 Z M 16,-16 L 11,-12 L 14,-9 Z" fill="#F59E0B" />

    <!-- Left Half: Radiant Sun -->
    <path d="M 0,-15 A 15,15 0 0,0 0,15 Z" fill="url(#leyendasSunGrad)" />
    
    <!-- Right Half: Silver Moon Crescent -->
    <path d="M 0,-15 A 15,15 0 0,1 0,15 A 11,11 0 0,0 0,-15 Z" fill="#E2E8F0" />
    
    <!-- Star Spark in Moon curve -->
    <path d="M 8,-4 L 9,-1 L 12,0 L 9,1 L 8,4 L 7,1 L 4,0 L 7,-1 Z" fill="#FFFFFF" />
  </g>
</svg>
