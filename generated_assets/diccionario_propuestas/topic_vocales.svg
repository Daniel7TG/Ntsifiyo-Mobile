<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="vocalesCreamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#vocalesCreamBg)" />

  <!-- 5 Vowels Ring (A, E, I, O, U) -->
  <g transform="translate(32, 32)">
    <!-- Connecting Ring Circle -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3 3" />

    <!-- Vowel 'A' (Top Red) -->
    <g transform="translate(0, -16)">
      <circle cx="0" cy="0" r="6.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M -2.5,3 L 0,-3 L 2.5,3 M -1.5,1 L 1.5,1" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Vowel 'E' (Top Right Blue) -->
    <g transform="translate(15, -5)">
      <circle cx="0" cy="0" r="6.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M 2,-2.5 L -1.5,-2.5 L -1.5,2.5 L 2,2.5 M -1.5,0 L 1.2,0" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Vowel 'I' (Bottom Right Green) -->
    <g transform="translate(9, 13)">
      <circle cx="0" cy="0" r="6.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M 0,-2.5 L 0,2.5 M -1.5,-2.5 L 1.5,-2.5 M -1.5,2.5 L 1.5,2.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
    </g>

    <!-- Vowel 'O' (Bottom Left Yellow/Orange) -->
    <g transform="translate(-9, 13)">
      <circle cx="0" cy="0" r="6.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.2" />
      <circle cx="0" cy="0" r="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" />
    </g>

    <!-- Vowel 'U' (Top Left Purple) -->
    <g transform="translate(-15, -5)">
      <circle cx="0" cy="0" r="6.5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M -2,-2.5 L -2,0.5 C -2,2 2,2 2,0.5 L 2,-2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
    </g>
  </g>
</svg>
