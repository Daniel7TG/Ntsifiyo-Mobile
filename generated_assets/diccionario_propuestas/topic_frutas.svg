<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="frutasSunBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="frutasCitrusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#frutasSunBg)" />

  <!-- Juicy Citrus Half -->
  <g transform="translate(32, 32)">
    <!-- Outer Peel -->
    <circle cx="0" cy="0" r="21" fill="url(#frutasCitrusGrad)" />
    <!-- White Pith Ring -->
    <circle cx="0" cy="0" r="18" fill="#FFFBEB" />
    <!-- Orange Flesh Center -->
    <circle cx="0" cy="0" r="16" fill="#F97316" />

    <!-- 8 Sliced Segments -->
    <g fill="#FFA500">
      <path d="M 0,0 L 0,-14 A 14,14 0 0,1 9.9,-9.9 Z" />
      <path d="M 0,0 L 9.9,-9.9 A 14,14 0 0,1 14,0 Z" />
      <path d="M 0,0 L 14,0 A 14,14 0 0,1 9.9,9.9 Z" />
      <path d="M 0,0 L 9.9,9.9 A 14,14 0 0,1 0,14 Z" />
      <path d="M 0,0 L 0,14 A 14,14 0 0,1 -9.9,9.9 Z" />
      <path d="M 0,0 L -9.9,9.9 A 14,14 0 0,1 -14,0 Z" />
      <path d="M 0,0 L -14,0 A 14,14 0 0,1 -9.9,-9.9 Z" />
      <path d="M 0,0 L -9.9,-9.9 A 14,14 0 0,1 0,-14 Z" />
    </g>

    <!-- White Segment Dividers -->
    <circle cx="0" cy="0" r="2.5" fill="#FFFBEB" />
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#FFFBEB" stroke-width="1.2" />
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#FFFBEB" stroke-width="1.2" />
    <line x1="-10.6" y1="-10.6" x2="10.6" y2="10.6" stroke="#FFFBEB" stroke-width="1.2" />
    <line x1="-10.6" y1="10.6" x2="10.6" y2="-10.6" stroke="#FFFBEB" stroke-width="1.2" />
  </g>

  <!-- Green Leaf on top right -->
  <path d="M 44,14 C 52,12 54,22 46,24 C 42,22 42,16 44,14 Z" fill="#10B981" />
</svg>
