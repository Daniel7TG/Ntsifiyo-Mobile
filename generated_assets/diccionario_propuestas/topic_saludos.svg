<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="saludosSunriseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="saludosGreenBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#saludosSunriseBg)" />

  <!-- Welcoming Chat Heart Intersecting Speech Bubbles -->
  <g transform="translate(32, 32)">
    <!-- Left Speech Bubble (Green) -->
    <g transform="translate(-8, -4)">
      <rect x="-14" y="-12" width="28" height="20" rx="8" fill="url(#saludosGreenBubble)" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M -6,8 L -12,14 L -8,6 Z" fill="#047857" />
      <!-- Smiley Face / Greeting Rays inside -->
      <circle cx="-4" cy="-3" r="1.5" fill="#FFFFFF" />
      <circle cx="4" cy="-3" r="1.5" fill="#FFFFFF" />
      <path d="M -4,2 C -2,5 2,5 4,2" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Right Speech Bubble (Orange/Amber) -->
    <g transform="translate(10, 6)">
      <rect x="-12" y="-10" width="24" height="16" rx="6" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M 4,6 L 10,11 L 7,5 Z" fill="#D97706" />
      <!-- Heart Symbol inside right bubble -->
      <path d="M 3,-3 C 3,-5 1,-6 0,-6 C -1,-6 -3,-5 -3,-3 C -3,-1 0,1 0,1 C 0,1 3,-1 3,-3 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
