<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="intrusoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="intrusoBlueTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="intrusoRedTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="intrusoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#intrusoBgGrad)" />

  <!-- 2x2 Grid of Cards -->
  <!-- Top Left: Normal Circle -->
  <g transform="translate(20, 20)" filter="url(#intrusoShadow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#intrusoBlueTile)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="18" cy="18" r="9" fill="#FFFFFF" />
  </g>

  <!-- Top Right: Normal Circle -->
  <g transform="translate(64, 20)" filter="url(#intrusoShadow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#intrusoBlueTile)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="18" cy="18" r="9" fill="#FFFFFF" />
  </g>

  <!-- Bottom Left: Normal Circle -->
  <g transform="translate(20, 64)" filter="url(#intrusoShadow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#intrusoBlueTile)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="18" cy="18" r="9" fill="#FFFFFF" />
  </g>

  <!-- Bottom Right: THE INTRUDER (Red Star Tile!) -->
  <g transform="translate(64, 64)" filter="url(#intrusoShadow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#intrusoRedTile)" stroke="#FDE047" stroke-width="2.5" />
    <!-- Star Emblem -->
    <path d="M 18,7 L 21,14 L 28,14 L 22.5,18.5 L 24.5,25 L 18,21 L 11.5,25 L 13.5,18.5 L 8,14 L 15,14 Z" fill="#FDE047" />
  </g>

  <!-- Glowing Warning Exclamation Aura over Intruder -->
  <circle cx="94" cy="62" r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="94" y="67" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">!</text>
</svg>
