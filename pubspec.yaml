name: jnatrjo_mobile
description: "App móvil Jñatrjo — plataforma de juegos para aprender mazahua (estudiantes y visitantes)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.2.0
  google_sign_in: ^7.2.0
  just_audio: ^0.10.6
  video_player: ^2.11.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/svgs/juegos/
    - assets/svgs/diccionario/
    - assets/map/
    - assets/coyote/
    - assets/dictionary/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-VariableFont.ttf
